<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha — #NoHayPartidos</title>
  <style>
    :root {
      --ink: #121212;
      --paper: #f3efe6;
      --rule: #121212;
      --mute: #5a574e;
      --grid: #d2cdc0;
      --guinda: #6B1D3A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--paper);
      color: var(--ink);
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Times New Roman", Times, "Liberation Serif", serif;
      font-size: 16px;
      line-height: 1.4;
      padding: 28px 24px 64px;
    }

    .hoja { max-width: 720px; margin: 0 auto; min-width: 0; }

    .volver {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .volver a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--grid);
    }

    .identidad {
      padding: 22px 0 8px;
      border-top: 3px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }

    .identidad h2 {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.01em;
    }

    .identidad .cargo {
      margin-top: 8px;
      font-size: 16px;
    }

    .identidad .lugar {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 4px;
    }

    .dato-morena {
      padding: 24px 0 8px;
      border-bottom: 1px solid var(--rule);
    }

    .dato-morena .rotulo {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
      min-height: 1.2em;
      color: var(--marca, var(--guinda));
    }

    .cifras {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-items: stretch;
    }

    .cifras.solo {
      grid-template-columns: 1fr;
    }

    .cifra {
      min-width: 0;
    }

    .cifras > .cifra + .cifra {
      border-left: 1px solid var(--rule);
      padding-left: 28px;
      margin-left: 28px;
    }

    .numero {
      font-size: 72px;
      line-height: 0.9;
      font-weight: 400;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--marca, var(--guinda));
    }

    .numero small { font-size: 32px; letter-spacing: 0; }

    .cifra-nombre {
      margin-top: 8px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--marca, var(--guinda));
    }

    .dato-morena h3 {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      max-width: 22em;
    }

    .dato-morena .detalle {
      margin-top: 10px;
      font-size: 14px;
      color: var(--mute);
      max-width: 40em;
    }

    .reparto { padding: 18px 0 8px; }

    .barra-partidos {
      display: flex;
      width: 100%;
      height: 18px;
      border: 1px solid var(--rule);
    }

    .barra-partidos span { display: block; height: 100%; min-width: 0; }

    .leyenda {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      list-style: none;
      margin-top: 10px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: 700;
    }

    .leyenda li { display: flex; align-items: center; gap: 6px; }

    .leyenda i {
      display: block;
      width: 9px;
      height: 9px;
      border: 1px solid var(--rule);
      flex: 0 0 9px;
    }

    .periodos {
      padding-top: 22px;
    }

    .tabla-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .periodos h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
      font-size: 18px;
    }

    th, td {
      text-align: left;
      padding: 14px 16px 14px 10px;
      border-bottom: 1px solid var(--grid);
      vertical-align: middle;
    }

    th {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      white-space: nowrap;
    }

    td.num {
      font-family: "Courier New", Courier, monospace;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      padding-right: 10px;
      white-space: nowrap;
    }

    tr.es-morena {
      background: var(--guinda);
      color: var(--paper);
    }

    tr.es-morena th,
    tr.es-morena td {
      border-bottom-color: var(--guinda);
      padding-left: 8px;
    }

    tr.es-morena td:first-child { letter-spacing: 0.04em; }

    footer {
      margin-top: 28px;
      border-top: 1px solid var(--rule);
      padding-top: 10px;
      font-size: 12px;
      color: var(--mute);
    }

    .aviso {
      border: 1px solid var(--rule);
      padding: 10px 12px;
      margin-top: 28px;
      font-size: 13px;
      line-height: 1.45;
    }

    .aviso + .aviso { margin-top: 12px; }

    .aviso strong {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .cta {
      margin-top: 24px;
    }

    .cta p {
      font-size: 14px;
      line-height: 1.35;
      color: var(--mute);
      margin-bottom: 10px;
    }

    .cta a {
      display: block;
      padding: 16px 20px;
      background: var(--ink);
      color: var(--paper);
      border: 2px solid var(--rule);
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.15;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .error {
      margin-top: 24px;
      border: 1px solid var(--rule);
      padding: 16px;
    }

    .ticket {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      font-size: 14px;
      line-height: 1.45;
    }

    .ticket a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    tr.es-mayoria td:first-child {
      box-shadow: inset 4px 0 0 var(--marca, var(--ink));
      padding-left: 8px;
    }

    @media (max-width: 720px) {
      .numero { font-size: 48px; }
      .numero small { font-size: 22px; }
      .identidad h2 { font-size: 26px; }
      .cifras { grid-template-columns: 1fr; }
      .cifras > .cifra + .cifra {
        border-left: 0;
        border-top: 1px solid var(--rule);
        margin-left: 0;
        padding-left: 0;
        margin-top: 20px;
        padding-top: 20px;
      }
      body { padding: 16px 12px 40px; }
    }

    @media (max-width: 560px) {
      table { font-size: 17px; min-width: 0; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr {
        border-bottom: 1px solid var(--rule);
        margin-bottom: 10px;
        padding: 4px 0 10px;
      }
      th, td {
        display: grid;
        grid-template-columns: 7em 1fr;
        gap: 8px;
        align-items: baseline;
        padding: 6px 8px;
        border-bottom: 0;
      }
      td::before {
        content: attr(data-label);
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mute);
      }
      td:first-child {
        font-size: 20px;
        grid-template-columns: 1fr;
        padding-top: 10px;
        padding-bottom: 8px;
      }
      td:first-child::before { display: none; }
      td.num { font-size: 17px; text-align: left; padding-right: 8px; }
      tr.es-morena { padding: 4px 0 10px; }
      tr.es-morena td { padding-left: 10px; padding-right: 10px; }
      tr.es-morena td::before { color: var(--paper); }
      tr.es-mayoria td:first-child { padding-left: 12px; }
    }
  </style>
</head>
<body>
  <div class="hoja">
    <p class="volver"><a href="./index.html">← Índice</a></p>

    <div id="cuerpo"></div>

    <footer id="pie"></footer>

    <aside class="aviso" id="nota-metodologica" hidden>
      <strong>Nota metodológica</strong>
      <span id="nota-texto"></span>
    </aside>

    <p class="ticket">
      Si eres un político, y tu información en esta web es incorrecta, o si quisieras incluir a un político, levanta un ticket aquí:
      <a href="https://github.com/e1016/nohaypartidos/issues/new">https://github.com/e1016/nohaypartidos/issues/new</a>
    </p>
  </div>

  <script>
    const PARTIDO = "MORENA";

    const COLORES = {
      MORENA: "#6B1D3A",
      PRI: "#C8102E",
      PAN: "#0055A5",
      PRD: "#E6B800",
      PVEM: "#2E8B3A",
      PT: "#7A1018",
      MC: "#F26522",
      CONVERGENCIA: "#D35400",
      PES: "#5C2D91",
      FXM: "#D81B60",
      PCD: "#5A7A94",
      PMT: "#6B4F2A",
      PMS: "#A67C00",
      PRT: "#8E1B2A",
      PSUM: "#9C2A2A",
      OTRO: "#6E6A60"
    };

    function colorPartido(partido) {
      return COLORES[partido] || COLORES.OTRO;
    }

    function colorTextoPartido(partido) {
      if (partido === "PRD" || partido === "PMS") return "#8A6A00";
      return colorPartido(partido);
    }

    function partidoDelAnio(partidos) {
      if (partidos.has(PARTIDO)) return PARTIDO;
      const resto = [...partidos].sort();
      return resto[0] || "OTRO";
    }

    function anioReferencia(fecha) {
      const m = String(fecha || "").match(/\d{4}/);
      return m ? Number(m[0]) : new Date().getFullYear();
    }

    function aniosMilitados(politico, anioCierre) {
      const porAnio = new Map();
      for (const p of politico.partidos || []) {
        const fin = p.fin == null ? anioCierre : p.fin;
        if (p.inicio == null || fin < p.inicio) continue;
        for (let y = p.inicio; y <= fin; y++) {
          if (!porAnio.has(y)) porAnio.set(y, new Set());
          porAnio.get(y).add(p.partido);
        }
      }
      const total = porAnio.size;
      let morena = 0;
      const porPartido = {};
      for (const partidos of porAnio.values()) {
        const dueño = partidoDelAnio(partidos);
        porPartido[dueño] = (porPartido[dueño] || 0) + 1;
        if (dueño === PARTIDO) morena += 1;
      }
      return {
        total,
        morena,
        porPartido,
        pct: total ? (morena / total) * 100 : 0
      };
    }

    function duracion(inicio, fin, anioCierre) {
      const cierre = fin == null ? anioCierre : fin;
      return Math.max(1, cierre - inicio + 1);
    }

    function textoFin(fin, anioCierre) {
      return fin == null ? "en curso (" + anioCierre + ")" : String(fin);
    }

    function fmt1(n) {
      return n.toLocaleString("es-MX", { maximumFractionDigits: 1 });
    }

    function pintar(data) {
      const params = new URLSearchParams(location.search);
      const i = Number(params.get("i"));
      const lista = data.politicos || [];
      const politico = lista[i];
      const anio = anioReferencia(data.fecha_referencia);

      if (!politico || Number.isNaN(i)) {
        document.getElementById("cuerpo").innerHTML =
          '<p class="error">No se encontró esa ficha. <a href="./index.html">Volver al índice</a>.</p>';
        return;
      }

      document.title = politico.nombre + " — No hay partidos";
      const m = aniosMilitados(politico, anio);
      const otros = m.total - m.morena;
      const pctOtros = 100 - m.pct;
      const soloMorena = m.pct >= 99.5;
      const periodos = (politico.partidos || []).slice().sort((a, b) => a.inicio - b.inicio);

      const mayor = Object.keys(m.porPartido)
        .map((p) => ({
          partido: p,
          anios: m.porPartido[p],
          pct: m.total ? (m.porPartido[p] / m.total) * 100 : 0
        }))
        .sort((a, b) => b.anios - a.anios || a.partido.localeCompare(b.partido))[0];
      const morenaNoMayoria = m.pct < 50 && mayor && mayor.partido !== PARTIDO;

      let titular;
      let detalle;
      if (soloMorena) {
        titular = "Figura en Morena. En las fuentes consultadas no aparece militancia en otro partido.";
        detalle = m.morena + " años documentados, todos en Morena.";
      } else if (morenaNoMayoria) {
        titular = "Figura en Morena, pero pasó más años en " + mayor.partido + ".";
        detalle = m.morena + " de " + m.total + " años en Morena (" + fmt1(m.pct) +
          "%). " + mayor.anios + " años en " + mayor.partido + " (" + fmt1(mayor.pct) + "%).";
      } else {
        titular = "Figura en Morena. Solo el " +
          fmt1(m.pct) + "% de su militancia documentada corresponde a ese partido.";
        detalle = m.morena + " de " + m.total + " años en Morena. " +
          otros + " años (" + fmt1(pctOtros) + "%) en otros partidos.";
      }

      const reparto = Object.keys(m.porPartido)
        .map((p) => ({
          partido: p,
          anios: m.porPartido[p],
          pct: m.total ? (m.porPartido[p] / m.total) * 100 : 0
        }))
        .sort((a, b) => {
          if (a.partido === PARTIDO) return -1;
          if (b.partido === PARTIDO) return 1;
          return b.anios - a.anios;
        });

      const cuerpo = document.getElementById("cuerpo");
      cuerpo.innerHTML =
        '<section class="identidad">' +
          "<h2>" + politico.nombre + "</h2>" +
          '<p class="cargo">' + politico.cargo + "</p>" +
          '<p class="lugar">' + politico.estado + "</p>" +
        "</section>" +
        '<section class="dato-morena">' +
          '<div class="cifras' + (morenaNoMayoria ? "" : " solo") + '">' +
            '<div class="cifra" style="--marca:' + colorTextoPartido(PARTIDO) + '">' +
              '<p class="rotulo">Tiempo documentado</p>' +
              '<div class="numero">' + fmt1(m.pct) + "<small>%</small></div>" +
              '<p class="cifra-nombre">Morena</p>' +
            "</div>" +
            (morenaNoMayoria
              ? '<div class="cifra" style="--marca:' + colorTextoPartido(mayor.partido) + '">' +
                  '<p class="rotulo">Más años</p>' +
                  '<div class="numero">' + fmt1(mayor.pct) + "<small>%</small></div>" +
                  '<p class="cifra-nombre">' + mayor.partido + "</p>" +
                "</div>"
              : "") +
          "</div>" +
          "<h3>" + titular + "</h3>" +
          '<p class="detalle">' + detalle + "</p>" +
          '<div class="reparto">' +
            '<div class="barra-partidos" id="barra-partidos"></div>' +
            '<ul class="leyenda" id="leyenda"></ul>' +
          "</div>" +
        "</section>" +
        '<section class="periodos">' +
          "<h3>Partidos y años</h3>" +
          '<div class="tabla-scroll"><table>' +
            "<thead><tr>" +
              "<th>Partido</th><th>Inicio</th><th>Fin</th><th class=\"num\">Años</th>" +
            "</tr></thead>" +
            '<tbody id="filas-partidos"></tbody>' +
          "</table></div>" +
        "</section>" +
        '<aside class="cta">' +
          "<p>Hay una lista completa con el tiempo de militancia de cada uno.</p>" +
          '<a href="./index.html">Todos los políticos →</a>' +
        "</aside>";

      const barra = document.getElementById("barra-partidos");
      const leyenda = document.getElementById("leyenda");
      reparto.forEach((seg) => {
        const tramo = document.createElement("span");
        tramo.style.flex = String(seg.anios);
        tramo.style.background = colorPartido(seg.partido);
        tramo.title = seg.partido + " · " + fmt1(seg.pct) + "%";
        barra.appendChild(tramo);

        const li = document.createElement("li");
        const sw = document.createElement("i");
        sw.style.background = colorPartido(seg.partido);
        li.appendChild(sw);
        li.appendChild(document.createTextNode(seg.partido + " " + fmt1(seg.pct) + "%"));
        leyenda.appendChild(li);
      });

      const tbody = document.getElementById("filas-partidos");
      periodos.forEach((p) => {
        const tr = document.createElement("tr");
        if (p.partido === PARTIDO) tr.className = "es-morena";
        else if (morenaNoMayoria && p.partido === mayor.partido) {
          tr.className = "es-mayoria";
          tr.style.setProperty("--marca", colorPartido(p.partido));
        }
        tr.innerHTML =
          "<td data-label=\"Partido\">" + p.partido + "</td>" +
          "<td class=\"num\" data-label=\"Inicio\">" + p.inicio + "</td>" +
          "<td class=\"num\" data-label=\"Fin\">" + textoFin(p.fin, anio) + "</td>" +
          "<td class=\"num\" data-label=\"Años\">" + duracion(p.inicio, p.fin, anio) + "</td>";
        tbody.appendChild(tr);
      });

      document.getElementById("pie").textContent =
        "Corte " + anio + ". Cada año de militancia cuenta un punto. " +
        "Si cambió de partido el mismo año, ese año se asigna a Morena cuando aplica. " +
        "Los tramos de la tabla son los periodos registrados; pueden solaparse.";

      const nota = (data.nota_metodologica || "").trim();
      if (nota) {
        document.getElementById("nota-texto").textContent = nota;
        document.getElementById("nota-metodologica").hidden = false;
      }
    }

    </script>
    <script src="./morena.js"></script>
    <script>
      pintar(window.DATOS_MORENA);
    </script>
</body>
</html>
